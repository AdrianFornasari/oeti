name: Sponsor demo frontend

'on':
  push:
    branches: [integration/sponsor-demo-v047]
  pull_request:
    branches: [main, integration/sponsor-demo-v047]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sponsor-demo-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-demo:
    name: Sponsor demo / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CIRCLE_NODE_TOTAL: '2'
      NODE_OPTIONS: '--max-old-space-size=512 --max-semi-space-size=8'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm ci --workspace apps/web --include-workspace-root=false --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: node node_modules/typescript/bin/tsc --project apps/web/tsconfig.json --incremental false
      - name: Build sponsor demo
        run: npm --workspace apps/web run build -- --webpack
