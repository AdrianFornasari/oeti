[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onehealth-worker"
version = "0.1.0"
description = "Ingestion and extraction worker for One Health Emerging Threat Intelligence"
requires-python = ">=3.14"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "tenacity>=9,<10"
]

[tool.setuptools.packages.find]
where = ["src"]
